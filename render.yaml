services:
  - type: web
    name: mindx-codelab-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
